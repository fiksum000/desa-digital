name: Quality checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  php-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, mbstring, fileinfo, iconv
      - name: PHP syntax check
        run: find . -path './vendor' -prune -o -name '*.php' -type f -print0 | xargs -0 -n1 php -l
      - name: Project invariants
        run: php tests/invariants.php
