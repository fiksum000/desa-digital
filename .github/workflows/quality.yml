name: Quality checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  php-checks:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: ci-root-pass
          MARIADB_DATABASE: desa_digital
          MARIADB_USER: ci_app
          MARIADB_PASSWORD: ci-app-pass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: desa_digital
      DB_USER: ci_app
      DB_PASSWORD: ci-app-pass
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, mbstring, fileinfo, iconv
      - name: Install MariaDB client
        run: sudo apt-get update && sudo apt-get install -y mariadb-client
      - name: Shell script syntax check
        run: bash -n bin/backup.sh bin/restore.sh
      - name: PHP syntax check
        run: find . -path './vendor' -prune -o -name '*.php' -type f -print0 | xargs -0 -n1 php -l
      - name: Project invariants
        run: php tests/invariants.php
      - name: Initialize MariaDB schema
        env:
          DB_ROOT_PASSWORD: ci-root-pass
        run: mariadb --host=127.0.0.1 --user=root --password="$DB_ROOT_PASSWORD" --database=desa_digital < schema.sql
      - name: Database integration tests
        run: php tests/schema_integration.php
      - name: Verify identifier migration is idempotent
        run: APP_KEY="$(openssl rand -hex 32)" php bin/migrate_private_identifiers.php
      - name: Verify service letter migration is idempotent
        run: APP_KEY="$(openssl rand -hex 32)" php bin/migrate_service_letters.php
      - name: Authenticated RT and document module page smoke tests
        run: |
          APP_KEY="$(openssl rand -hex 32)" php tests/module_page_smoke.php rt-data
          APP_KEY="$(openssl rand -hex 32)" php tests/module_page_smoke.php dokumen
          APP_KEY="$(openssl rand -hex 32)" php tests/module_page_smoke.php notifikasi
      - name: Public homepage HTTP smoke test
        run: |
          APP_KEY="$(openssl rand -hex 32)" php -S 127.0.0.1:8080 -t . >/tmp/desa-digital-php.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent --show-error http://127.0.0.1:8080/index.php?page=home -o /tmp/desa-digital-home.html; then
              break
            fi
            sleep 1
          done
          test -s /tmp/desa-digital-home.html
          grep -F 'Layanan desa,' /tmp/desa-digital-home.html
          # Guard the main visual sections from accidental removal during UI changes.
          grep -F 'Ajukan Surat' /tmp/desa-digital-home.html
          grep -F 'Lacak Pengajuan' /tmp/desa-digital-home.html
          grep -F 'Layanan Surat' /tmp/desa-digital-home.html
          grep -F 'Pengaduan Warga' /tmp/desa-digital-home.html
          grep -F 'Cek Status Pengajuan' /tmp/desa-digital-home.html
          grep -F 'Berita & Pengumuman' /tmp/desa-digital-home.html
          grep -F 'Jumlah Penduduk' /tmp/desa-digital-home.html
          grep -F 'Navigasi mobile' /tmp/desa-digital-home.html
