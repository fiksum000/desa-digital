<VirtualHost *:80>
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/html
    <Directory /var/www/html>
        Options -Indexes
        AllowOverride All
        Require all granted
    </Directory>
    <Directory /var/www/html/storage>
        Require all denied
    </Directory>
    <Directory /var/www/html/assets/uploads>
        Options -Indexes -ExecCGI
        AllowOverride None
        RemoveHandler .php .phtml .phar .cgi .pl .py .sh
        <FilesMatch "\\.(?i:php[0-9]?|phtml|phar|cgi|pl|py|sh)$">
            Require all denied
        </FilesMatch>
    </Directory>
    <Directory /var/www/html/bin>
        Require all denied
    </Directory>
    <Directory /var/www/html/docker>
        Require all denied
    </Directory>
    <Directory /var/www/html/app>
        Require all denied
    </Directory>
    <Directory /var/www/html/tests>
        Require all denied
    </Directory>
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
